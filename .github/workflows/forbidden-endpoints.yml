name: Forbidden Endpoints

# Enforces atv-design Spec Principle 2 ("Sanctioned auth only") and Risk R11
# from .omc/plans/ralplan-fork-open-codesign-copilot-skills-final.md.
#
# ADR-0001 amendment (2026-05-01): copilot_internal/v2/token is the SOLE
# sanctioned copilot_internal/* path (session-token exchange only).
# All other copilot_internal/* paths remain forbidden.
#
# Companion review checklist: docs/security-checklist.md

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for unsanctioned copilot_internal usage
        run: |
          # Allowed: the documented session-token URL only (ADR-0001 carve-out).
          # Scope: source packages and apps only.
          # The carve-out is anchored: 'copilot_internal/v2/token' must be
          # followed by end-of-line OR a punctuation char that ends a path
          # segment AND is not a forward slash. This rejects impostor paths:
          #   /v2/token-stealer  → '-' is in the negated class → caught
          #   /v2/tokenize       → 'i' is in the negated class → caught
          #   /v2/token/admin    → '/' is in the negated class → caught
          # Filter out:
          #   - lines containing the (anchored) sanctioned /v2/token path
          #   - comment lines (// * # or leading whitespace+*) discussing the prohibition
          if git grep -nE 'copilot_internal' \
              -- 'packages/' 'apps/' \
                 ':(exclude).github/workflows/__fixtures__/' \
              | grep -vE 'copilot_internal/v2/token($|[^A-Za-z0-9_/-])' \
              | grep -vE ':\s*(//|\*|#|\s\*)' ; then
            echo "::error::Found unsanctioned copilot_internal/* usage in source code. See docs/adr/0001-byok-oauth-posture.md."
            exit 1
          fi
          echo "OK: only sanctioned copilot_internal/v2/token references found in source."

      - name: Run regex fixture self-test
        run: bash .github/workflows/__fixtures__/copilot-internal-fixture.sh

      - name: Forbid hard-coded OAuth client secrets
        shell: bash
        run: |
          set -e
          # Heuristic: any literal that looks like a GitHub OAuth client secret
          # (40 hex chars) appearing on the same line as 'client_secret', or
          # any 'client_secret' assignment to a non-empty literal outside test
          # fixtures explicitly marked as such.
          MATCHES=$(git grep -nIE \
            --untracked \
            'client_secret\s*[:=]\s*["'\''][^"'\'' ]{8,}["'\'']' \
            -- ':!docs/security-checklist.md' \
               ':!docs/adr' \
               ':!.github/workflows/forbidden-endpoints.yml' \
               ':!node_modules' \
               ':!**/node_modules' \
               ':!**/__fixtures__/**' \
               ':!**/test-fixtures/**' \
               ':!.omc' \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Hard-coded OAuth client_secret detected. atv-design uses public client ID + PKCE only — see docs/adr/0001-byok-oauth-posture.md."
            echo "$MATCHES"
            exit 1
          fi

      - name: Forbid token logging patterns (heuristic)
        shell: bash
        run: |
          set -e
          # Heuristic: console.log or logger calls that include 'Bearer' string
          # interpolation. Will produce false positives in test files; restrict
          # to source paths.
          MATCHES=$(git grep -nIE \
            --untracked \
            '(console\.(log|info|debug|warn|error)|logger\.[a-z]+)\s*\([^)]*Bearer\s*\$\{' \
            -- 'src/**' 'apps/**/src/**' 'packages/**/src/**' \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Possible token leak in log statement (Bearer \${token} pattern). Redact tokens before logging — see docs/security-checklist.md observability O1."
            echo "$MATCHES"
            exit 1
          fi

      - name: Summary
        if: success()
        run: echo "✅ No forbidden endpoints, hard-coded secrets, or obvious token-leak patterns detected."
