<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>ATV Design</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        // Merge Q1: Terminal 42 dark pro-tool is the single identity. Default to
        // dark; only an explicit 'light' choice opts out. FOUC-prevention runs
        // before paint so the canvas never flashes the wrong theme.
        try {
          var t = localStorage.getItem('atv-design:theme');
          if (t !== 'light') document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage unavailable; default to the dark pro-tool identity */
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
